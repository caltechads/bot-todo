[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[project]
name = "bot-todo"
version = "0.2.0"
description = "Manage canonical repository task files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["portalocker>=2.7"]
classifiers = [
    "Development Status :: 5 - Production/Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/caltechads/bot-todo"
Repository = "https://github.com/caltechads/bot-todo"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests", "htmlcov", "bin"]
where = ["."]

[project.scripts]
bot-todo = "bot_todo.cli:main"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6", "build>=1.2.2.post1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
target-version = "py311"


###############################################################################
# bump-my-version Configuration
###############################################################################
[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true
tag_name = "{new_version}"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(-dev(?P<dev>\\d+))?"
serialize = [
  "{major}.{minor}.{patch}-dev{dev}",
  "{major}.{minor}.{patch}"
]

# Files to update

[[tool.bumpversion.files]]
filename = "Makefile"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""


